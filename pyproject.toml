[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gee-flooding-research"
version = "0.1.0"
description = "Independent observation-aware urban flood susceptibility research"
requires-python = ">=3.10"
dependencies = [
 "numpy>=1.26,<3", "pandas>=2.1", "pyarrow>=14", "shapely>=2.0",
 "pyproj>=3.6", "rasterio>=1.3", "scikit-learn>=1.3", "requests>=2.31", "joblib>=1.3",
 "geopandas>=1.0", "pyogrio>=0.10", "scipy>=1.11", "matplotlib>=3.8", "openpyxl>=3.1"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gee-flooding = "gee_flooding.cli:main"

[tool.setuptools.packages.find]
include = ["gee_flooding*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
