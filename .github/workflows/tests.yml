name: Research pipeline checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest -q
      - name: Validate CLI and configuration
        run: |
          python -m gee_flooding --help
          python -c "import json; json.load(open('config/project.json',encoding='utf-8'))"
